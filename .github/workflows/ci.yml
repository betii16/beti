name: CI

on:
  pull_request:
  push:
    branches: [main, refonte]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Valeurs factices : ni le build ni les tests n'appellent un vrai Supabase.
  # Les tests de la base tournent sur un Postgres embarqué (tests/db).
  NEXT_PUBLIC_SUPABASE_URL: http://localhost:54321
  NEXT_PUBLIC_SUPABASE_ANON_KEY: cle-anon-factice
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Types
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Tests (base de données et unitaires)
        run: npm test
      - name: Build
        run: npm run build
