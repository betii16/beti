# Appli Android d'essai : un APK installable à la main sur un téléphone (signé avec la clé de
# débogage, donc pas pour Google Play). Le télécharger : onglet Actions de GitHub, dernière
# exécution « Appli Android », fichier « beti-android-debug » en bas de la page.
# Se lance à la main (bouton « Run workflow ») ou à chaque envoi qui touche l'appli native.
name: Appli Android

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'assets/**'
      - 'www/**'
      - 'capacitor.config.ts'
      - 'package-lock.json'
      - '.github/workflows/android.yml'

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # Les paquets Capacitor de node_modules portent le code Android des plugins.
      - run: npm ci
      # Capacitor 8 demande Java 21 ; le kit Android est déjà sur les machines de GitHub.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - run: npx cap sync android
      - name: Construire l'APK d'essai
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: beti-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

  # Essai sans téléphone : l'APK est installé sur un émulateur Android, lancé, et photographié
  # (fichier « beti-android-captures » : écran de lancement, site chargé, icône, erreurs du journal).
  essai:
    needs: apk
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: beti-android-debug
      - name: Activer KVM (accélère l'émulateur)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # Chaque ligne du script est une commande à part.
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            mkdir -p captures
            adb install app-debug.apk
            adb shell am start -n dz.beti.app/.MainActivity
            sleep 3 && adb exec-out screencap -p > captures/1-lancement.png
            sleep 40 && adb exec-out screencap -p > captures/2-site.png
            adb logcat -d -s Capacitor Capacitor/Console chromium > captures/journal-appli.txt || true
            adb logcat -d '*:E' > captures/erreurs.txt || true
            adb shell input keyevent KEYCODE_HOME && sleep 2 && adb shell input swipe 540 2000 540 500 300 && sleep 3 && adb exec-out screencap -p > captures/3-icone.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: beti-android-captures
          path: captures/
          retention-days: 30
