<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>BETI</title>
<!-- Page de l'appli quand le site est injoignable (errorPath de capacitor.config.ts). Identité « Le bloc » :
     blanc, noir, bouton en pilule. Hors ligne, les polices du site ne se chargent pas : celles du téléphone servent. -->
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#fff;color:#111;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:16px;text-align:center;padding:calc(24px + env(safe-area-inset-top)) 24px calc(24px + env(safe-area-inset-bottom))}
h1{font-size:34px;font-weight:800;letter-spacing:-.03em;line-height:1}
p{font-size:16px;color:#5f5b6b;line-height:1.6;max-width:300px}
button{margin-top:8px;min-width:180px;min-height:52px;padding:0 28px;border-radius:999px;background:#111;border:0;color:#fff;font-size:16px;font-weight:600;cursor:pointer}
[lang=ar]{direction:rtl}
[lang=ar] h1{letter-spacing:0;line-height:1.4}
</style>
</head>
<body>
<h1 id="t">beti</h1>
<p id="m">Connexion impossible. Vérifiez votre connexion internet, puis réessayez.</p>
<button id="b" type="button">Réessayer</button>
<script>
try{
  var ar=(navigator.language||'').toLowerCase().indexOf('ar')===0;
  if(ar){document.documentElement.lang='ar';document.body.lang='ar';
    document.getElementById('t').textContent='باتي';
    document.getElementById('m').textContent='تعذّر الاتصال. تحقق من الإنترنت ثم أعد المحاولة.';
    document.getElementById('b').textContent='إعادة المحاولة';}
  // Retour au site lui-même (server.url de capacitor.config.ts) : recharger cette page locale ne mènerait nulle part.
  document.getElementById('b').onclick=function(){location.replace('https://beti-ten.vercel.app/')};
  var C=window.Capacitor;if(C&&C.Plugins&&C.Plugins.SplashScreen)C.Plugins.SplashScreen.hide();
}catch(e){}
</script>
</body>
</html>
