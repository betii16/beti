<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>BETI</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{background:#0b0b12;color:#e0dfe5;font-family:system-ui,-apple-system,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:20px;text-align:center;padding:24px}
    .logo{width:64px;height:64px;background:linear-gradient(135deg,#5A3DF0,#7C5CFF);border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:800;color:#fff}
    h1{font-size:18px;letter-spacing:0.1em}
    p{font-size:14px;color:#8585a0;line-height:1.6;max-width:280px}
    button{margin-top:8px;padding:12px 28px;border-radius:12px;background:linear-gradient(135deg,#5A3DF0,#7C5CFF);border:none;color:#fff;font-size:14px;font-weight:700;cursor:pointer}
  </style>
</head>
<body>
  <div class="logo">B</div>
  <h1>BETI</h1>
  <p>Connexion impossible. Vérifie ta connexion internet puis réessaie.</p>
  <button onclick="location.reload()">Réessayer</button>
</body>
</html>
